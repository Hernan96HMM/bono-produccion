services:
  db:
    image: postgres:16
    container_name: sica_bonobd
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: sica_bonos
      POSTGRES_USER: sica
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sica -d sica_bonos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build: ./backend
    container_name: sica_bonos_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sica:${DB_PASSWORD}@db:5432/sica_bonos
      JWT_SECRET: ${JWT_SECRET}
      TZ: UTC
    restart: always

  frontend:
    build: ./frontend
    container_name: sica_bonos_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
